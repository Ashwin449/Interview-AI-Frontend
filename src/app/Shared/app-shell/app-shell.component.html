<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 4.5a3.5 3.5 0 0 0-3.4 4.3A3 3 0 0 0 4 11.5a3 3 0 0 0 2 2.8V17a3 3 0 0 0 3 3h.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M15 4.5a3.5 3.5 0 0 1 3.4 4.3A3 3 0 0 1 20 11.5a3 3 0 0 1-2 2.8V17a3 3 0 0 1-3 3h-.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M9 4.5c0-1 1.3-1.8 3-1.8s3 .8 3 1.8v13c0 1.1-.9 2-2 2h-2a2 2 0 0 1-2-2v-13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M12 8v9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.5 2.4" />
        </svg>
      </div>
      <div class="brand__text">
        <span class="brand__name">IntervueAI</span>
        <span class="brand__tagline">Prepare &middot; Practice &middot; Perform</span>
      </div>
    </div>

    <nav class="nav">
      <a
        *ngFor="let item of navItems"
        class="nav__item"
        [routerLink]="item.route"
        routerLinkActive="nav__item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <span class="nav__icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none">
            <path d="M4 11.5 12 5l8 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6 10v8.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg *ngSwitchCase="'mic'" viewBox="0 0 24 24" fill="none">
            <rect x="9.5" y="3.5" width="5" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.7" />
            <path d="M6.5 12a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M12 17.5V20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none">
            <circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="1.7" />
            <path d="M3.5 20a5.5 5.5 0 0 1 11 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M15.5 8.7a2.6 2.6 0 1 1 2 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M15 13.3c2.2.2 3.9 1.7 4.3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'file'" viewBox="0 0 24 24" fill="none">
            <path d="M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M9 12.5h6M9 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'briefcase'" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="8" width="16" height="10.5" rx="2" stroke="currentColor" stroke-width="1.7" />
            <path d="M9 8V6.5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2V8" stroke="currentColor" stroke-width="1.7" />
          </svg>
          <svg *ngSwitchCase="'check-circle'" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
            <path d="M8.5 12.3l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg *ngSwitchCase="'user'" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.7" />
            <path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'bar-chart'" viewBox="0 0 24 24" fill="none">
            <path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6M17.7 17.7l-1.6-1.6M7.9 7.9 6.3 6.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <span class="nav__label">{{ item.label }}</span>
      </a>
    </nav>

    <svg class="sidebar__wave" viewBox="0 0 220 160" fill="none" aria-hidden="true" preserveAspectRatio="none">
      <path d="M0 90c30-25 60 25 90 0s60-40 90-10 40 40 40 40v40H0V90Z" fill="url(#waveGradient)" />
      <defs>
        <linearGradient id="waveGradient" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35" />
          <stop offset="1" stop-color="#4f46e5" stop-opacity="0" />
        </linearGradient>
      </defs>
    </svg>

    <p class="sidebar__quote">"Better Interviews.<br />Brighter Careers."</p>
  </aside>

  <div class="page">
    <router-outlet></router-outlet>
  </div>
</div>
