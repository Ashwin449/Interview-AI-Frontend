<main class="main">
  <!-- Top bar -->
  <header class="topbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" />
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <input type="text" placeholder="Search candidates, interviews, or jobs..." />
    </label>

    <div class="topbar__actions">
      <button class="icon-button" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6 9.5a6 6 0 0 1 12 0c0 3.5 1 5 1.5 5.5H4.5C5 14.5 6 13 6 9.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M10 18.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="icon-button__dot"></span>
      </button>

      <button class="profile-pill" type="button">
        <span class="profile-pill__avatar">A</span>
        <span class="profile-pill__text">
          <span class="profile-pill__name">{{ userName }}</span>
          <span class="profile-pill__role">{{ userRole }}</span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" class="profile-pill__chevron">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="page-header">
    <div>
      <h1>Assessments</h1>
      <p>Create and manage all assessments for technical and behavioral evaluation.</p>
    </div>
    <button class="btn btn--primary" type="button" (click)="onCreateAssessment()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" /></svg>
      Create Assessment
    </button>
  </div>

  <!-- Stats -->
  <section class="stats">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-card__icon" [class]="'stat-card__icon--' + stat.tone">
        <svg *ngIf="stat.icon === 'list'" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7" />
          <path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <svg *ngIf="stat.icon === 'active'" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
          <path d="M8.3 12.3l2.4 2.4 5-5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="stat.icon === 'attempts'" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
          <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="stat.icon === 'score'" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="stat-card__value">{{ stat.value }}</div>
      <div class="stat-card__label">{{ stat.label }}</div>
    </div>
  </section>

  <section class="panel-card">
    <div class="table-toolbar">
      <div class="tabs">
        <button
          class="tabs__item"
          *ngFor="let tab of tabs"
          [class.tabs__item--active]="tab === activeTab"
          type="button"
          (click)="onSetTab(tab)"
        >
          {{ tab }}
        </button>
      </div>
      <button class="filter-button" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
        Filter
      </button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>Assessment Name</th>
          <th>Type</th>
          <th>Questions</th>
          <th>Duration</th>
          <th>Status</th>
          <th>Created On</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredAssessments">
          <td>{{ row.name }}</td>
          <td class="muted">{{ row.type }}</td>
          <td class="muted">{{ row.questions }}</td>
          <td class="muted">{{ row.duration }}</td>
          <td>
            <span
              class="status-pill"
              [class.status-pill--complete]="row.status === 'Active'"
              [class.status-pill--inactive]="row.status === 'Inactive'"
            >
              {{ row.status }}
            </span>
          </td>
          <td class="muted">{{ row.createdOn }}</td>
          <td>
            <button class="link-button" type="button" (click)="onStartAssessment(row)">Start</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

  <button class="assistant-banner" type="button" (click)="onGenerateWithAi()">
    <span class="assistant-banner__icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
    </span>
    <span class="assistant-banner__text">
      <span class="assistant-banner__title">AI-Powered Assessment Generation</span>
      <span class="assistant-banner__desc">Let AI create customized assessments based on job description or resume.</span>
    </span>
    <span class="assistant-banner__cta">Generate with AI</span>
  </button>
</main>
