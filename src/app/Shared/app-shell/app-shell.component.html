<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4" y="7" width="16" height="12" rx="4" stroke="currentColor" stroke-width="1.6" />
          <circle cx="9" cy="13" r="1.3" fill="currentColor" />
          <circle cx="15" cy="13" r="1.3" fill="currentColor" />
          <path d="M12 7V4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </div>
      <div class="brand__text">
        <span class="brand__name">IntervueAI</span>
        <span class="brand__tagline">Practice, then perform</span>
      </div>
    </div>

    <nav class="nav">
      <a
        *ngFor="let item of navItems"
        class="nav__item"
        [routerLink]="item.route"
        routerLinkActive="nav__item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <span class="nav__icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none">
            <path d="M4 11.5 12 5l8 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6 10v8.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg *ngSwitchCase="'file'" viewBox="0 0 24 24" fill="none">
            <path d="M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M9 12.5h6M9 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'mic'" viewBox="0 0 24 24" fill="none">
            <rect x="9.5" y="3.5" width="5" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M6.5 12a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M12 17.5V20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'check-circle'" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M8.5 12.3l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg *ngSwitchCase="'user'" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="nav__label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar__note">
      <p>Every interview makes you better.</p>
    </div>
  </aside>

  <div class="page">
    <router-outlet></router-outlet>
  </div>
</div>
